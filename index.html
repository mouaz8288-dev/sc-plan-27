<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خطة النادي الصيفي · محمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 100% 0,#f0eef8,transparent 60%),#f6f6f3;font:400 16px/1.7 Alexandria,Tahoma,sans-serif;color:#111}
.card{width:min(100%,560px);background:#fff;border-radius:40px;padding:clamp(28px,6vw,64px) clamp(22px,5vw,64px) 32px;box-shadow:0 30px 80px rgb(0 0 0 / .07),0 1px 0 rgb(0 0 0 / .03);text-align:center}
.logo{font:700 clamp(30px,5vw,40px)/1 Montserrat,Arial,sans-serif;letter-spacing:-.01em;direction:ltr;margin-bottom:clamp(36px,6vw,56px)}
.logo img{height:clamp(34px,6vw,46px);width:auto}
.eb{font:600 14px Montserrat,Arial,sans-serif;letter-spacing:4px;color:#7445f0;direction:ltr}
h1{font-weight:700;font-size:clamp(26px,4.5vw,36px);line-height:1.3;margin:14px 0 6px}
.sub{color:#555;margin:0}
.chip{display:inline-block;margin:24px 0 28px;padding:4px 18px;border:1px solid #dcdcd6;border-radius:999px;background:#f6f6f3;color:#333;font-size:15px}
label{display:block;text-align:right;color:#555;margin-bottom:8px}
.field{position:relative}
input{width:100%;height:64px;border:1.5px solid #d9d9d2;border-radius:20px;padding:0 20px 0 64px;font:500 18px Montserrat,Alexandria,sans-serif;letter-spacing:.08em;color:#111;background:#fff;text-align:center;direction:ltr;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:#7445f0;box-shadow:0 0 0 5px rgb(116 69 240 / .12)}
.err input{border-color:#e0453c;box-shadow:0 0 0 5px rgb(224 69 60 / .12)}
.eye{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;color:#888;cursor:pointer;border-radius:12px;display:grid;place-items:center}
.eye:hover{color:#111}
.eye:focus-visible,button.go:focus-visible{outline:2px solid #7445f0;outline-offset:2px}
.eye svg{width:24px;height:24px}
button.go{width:100%;height:64px;margin-top:16px;border:0;border-radius:20px;background:#111;color:#fff;font:700 20px Alexandria,sans-serif;cursor:pointer;transition:transform .15s,opacity .2s}
button.go:hover{transform:translateY(-1px)}
button.go[disabled]{opacity:.6;cursor:progress}
.msg{min-height:26px;margin:12px 0 0;color:#e0453c;font-size:14px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:28px;padding-top:22px;border-top:1px solid #e6e6e1;color:#8a8a85;font:600 13px Montserrat,Arial,sans-serif;letter-spacing:3px}
.foot svg{width:18px;height:18px}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:no-preference){.err .field{animation:shake .4s}}
</style>
</head>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.s),iterations:D.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.i)},key,b64(D.c));
 return new TextDecoder().decode(pt);
}
const show=html=>{document.open();document.write(html);document.close()};
const f=document.getElementById('f'),pw=document.getElementById('pw'),go=document.getElementById('go'),msg=document.getElementById('msg');
document.getElementById('eye').onclick=e=>{const t=pw.type==='password';pw.type=t?'text':'password';e.currentTarget.setAttribute('aria-label',t?'إخفاء كلمة المرور':'إظهار كلمة المرور')};
f.onsubmit=async e=>{e.preventDefault();f.classList.remove('err');msg.textContent='';go.disabled=true;go.textContent='جارٍ الفتح…';
 try{const html=await open_(pw.value);try{sessionStorage.setItem('sc-k',pw.value)}catch(_){}show(html)}
 catch(_){go.disabled=false;go.textContent='فتح';void f.offsetWidth;f.classList.add('err');msg.textContent='كلمة المرور غير صحيحة، جرّب مرة ثانية.';pw.select()}};
(async()=>{let k=null;try{k=sessionStorage.getItem('sc-k')}catch(_){}if(k){try{show(await open_(k))}catch(_){try{sessionStorage.removeItem('sc-k')}catch(__){}}}})();
</script>
