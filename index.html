<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خطة النادي الصيفي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE  calm working plan, dark like the club's deck
   IDEA   a wall year-calendar on black, each period in its own colour from the club palette
   PICTURE the month grid tinted by period; a period page shows its months tinted by phase
   COLOUR near-black ground, light ink, six period colours: green, yellow, orange, red, purple, blue
   TYPE   Alexandria 300/400/500
   LAYOUT header with dates; intro panel with tab buttons and one table at a time; calendar; period pages */
:root{color-scheme:dark;--bg:#0e0e10;--card:#18181c;--card2:#212127;--ink:#f1f1f3;--mute:#9a9aa5;--line:#2c2c33;--acc:#8b5cf6}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.75 Alexandria,Tahoma,sans-serif;overflow-x:clip}
.wrap{max-width:1240px;margin-inline:auto;padding:clamp(20px,3.5vw,44px) max(4vw,16px)}
.rain{height:4px;width:120px;border-radius:4px;background:linear-gradient(to left,#4a97d8,#7b4cf5,#e0503f,#e8913c,#d8c23f,#5bb97a)}
h1{font-weight:500;font-size:clamp(28px,4vw,44px);line-height:1.2;margin:14px 0 6px;text-wrap:balance}
h2{font-weight:500;font-size:clamp(21px,2.6vw,28px);line-height:1.3;margin:0}
h3{font-weight:500;font-size:17px;margin:0 0 4px}
p{margin:0}
.mute{color:var(--mute)}
.dates{font-size:clamp(17px,2vw,20px);color:var(--mute);letter-spacing:.01em}
.dates b{color:var(--ink);font-weight:400}
.sec{margin-top:clamp(34px,5vw,56px)}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sec-h i{width:10px;height:10px;border-radius:3px;background:var(--acc)}
.panel{background:var(--card);border-radius:22px;padding:clamp(16px,2.6vw,26px)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tab{border:1px solid var(--line);background:transparent;color:var(--mute);font:inherit;font-size:15px;border-radius:12px;padding:8px 16px;min-height:44px;cursor:pointer}
.tab:hover{color:var(--ink);border-color:#3d3d46}
.tab[aria-selected=true]{background:var(--ink);color:#111;border-color:var(--ink)}
.lead{max-width:80ch;margin-bottom:16px}
.lead b{font-weight:500}
.kv{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kv th,.kv td{text-align:right;padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top;font-weight:400}
.kv tr:last-child th,.kv tr:last-child td{border-bottom:0}
.kv th{width:170px;color:var(--mute);background:var(--card2);font-size:15px}
.kv thead th{color:var(--mute);font-size:13px;background:var(--card2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:14px}
.dot{display:inline-block;width:12px;height:12px;border-radius:4px;margin-inline-end:8px;vertical-align:-1px}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0 0 24px}
.chip{display:inline-flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:6px 2px;min-height:44px;cursor:pointer;text-decoration:none}
.chip i{width:18px;height:18px;border-radius:5px;background:var(--c);flex:0 0 auto}
.chip small{color:var(--mute);font-size:13px}
.chip:hover span{text-decoration:underline;text-underline-offset:6px;text-decoration-color:var(--c)}
.chip[aria-pressed=true] span{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px;text-decoration-color:var(--c)}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:24px 28px}
.mon h3{font-size:16px;margin:0 0 8px}
.mon h3 span{color:var(--mute);font-weight:300;font-size:14px}
.dg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dh{font-size:12px;color:var(--mute);text-align:center}
.d{aspect-ratio:1;border:0;border-radius:8px;font:inherit;font-size:13px;display:grid;place-items:center;background:transparent;color:#55555e;padding:0;position:relative}
button.d{cursor:pointer;background:color-mix(in srgb,var(--c) 42%,var(--card));color:var(--ink)}
button.d:hover{background:color-mix(in srgb,var(--c) 70%,var(--card))}
button.d.full{background:var(--c);color:var(--on)}
.d.ms{outline:2px solid var(--ink);outline-offset:1px}
.d.now::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:currentColor}
.d.dim{opacity:.2}
.d:focus-visible,.chip:focus-visible,.back:focus-visible,.tab:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.keys{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:26px;font-size:14px;color:var(--mute)}
.keys b{font-weight:400;color:var(--ink)}
.ring{display:inline-block;width:14px;height:14px;border-radius:4px;outline:2px solid var(--ink);vertical-align:-2px;margin-inline-end:8px}
.back{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;border-radius:12px;padding:8px 16px;min-height:44px;cursor:pointer}
.ph-head{border-radius:22px;padding:22px clamp(18px,3vw,30px);background:color-mix(in srgb,var(--c) 16%,var(--card));margin:16px 0 22px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 22px;align-items:center;border-top:4px solid var(--c)}
.ph-head .n{font-size:clamp(46px,7vw,72px);line-height:1;color:var(--c);font-weight:300;grid-row:span 3}
.ph-head .meta{color:var(--mute);font-size:15px}
.ph-head .goal{grid-column:1/-1;margin-top:10px;font-size:17px;max-width:75ch}
.phl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.phc{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;border-radius:12px;padding:8px 14px;min-height:44px;cursor:pointer}
.phc i{width:14px;height:14px;border-radius:4px;background:var(--c)}
.phc small{color:var(--mute);font-size:13px}
.phc[aria-pressed=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 20%,var(--card))}
.cal2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:22px 26px;margin:0 0 30px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.card{background:var(--card);border-radius:18px;padding:18px 20px;border-top:4px solid var(--c);scroll-margin-top:16px}
.card.hi{box-shadow:0 0 0 2px var(--c)}
.card .dt{color:var(--mute);font-size:14px;white-space:nowrap}
.card dl{margin:8px 0 0}
.card dt{font-size:13px;color:var(--mute);margin-top:10px}
.card dd{margin:2px 0 0}
.msg{background:color-mix(in srgb,var(--c) 16%,var(--card2));border-radius:10px;padding:6px 12px}
.ax{list-style:none;padding:0;margin:4px 0 0}
.ax li{padding:6px 0;border-top:1px solid var(--line)}
.ax li:first-child{border-top:0}
.dots{padding-inline-start:18px;margin:6px 0 0}
.todo{list-style:none;padding:0;margin:6px 0 0}
.todo li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.todo li:first-child{border-top:0}
.todo li::before{content:"";flex:0 0 16px;height:16px;margin-top:6px;border:2px solid var(--acc);border-radius:4px}
.tbd{color:var(--mute);border:1px dashed #44444d;border-radius:6px;padding:0 6px;font-size:13px;font-style:normal;white-space:nowrap}
.scroll{overflow-x:auto}
[hidden]{display:none !important}
@media(max-width:600px){.ph-head{grid-template-columns:minmax(0,1fr)}.ph-head .n{grid-row:auto}.kv th{width:auto}.kv tr{display:grid}.kv th{border-bottom:0;padding-bottom:4px;background:transparent}.kv td{padding-top:0}.kv thead{display:none}}
</style>
</head>
